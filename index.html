<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jimmy's Diner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Smythe&family=Josefin+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div class="hero-content">
          <h1>Jimmy's Diner</h1>
          <p>The best burgers and pizzas in town.</p>
        </div>
      </header>

      <section id="menu-list" aria-label="Menu"></section>

      <section
        class="order-panel hidden"
        id="order-panel"
        aria-label="Your order"
      >
        <h2>Your order</h2>
        <div id="order-items"></div>
        <div class="order-totals" id="order-totals"></div>
        <button class="action-btn" id="complete-order-btn">
          Complete order
        </button>
      </section>

      <section id="feedback-container" aria-live="polite"></section>
    </main>

    <div
      class="modal hidden"
      id="payment-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="payment-title"
    >
      <form class="modal-card" id="payment-form">
        <h3 id="payment-title">Enter card details</h3>
        <input
          type="text"
          name="fullName"
          placeholder="Enter your name"
          minlength="2"
          required
        />
        <input
          type="text"
          name="cardNumber"
          placeholder="Enter card number"
          inputmode="numeric"
          pattern="[0-9\s]{12,23}"
          minlength="12"
          maxlength="23"
          required
        />
        <input
          type="text"
          name="cvv"
          placeholder="Enter CVV"
          inputmode="numeric"
          pattern="[0-9]{3,4}"
          minlength="3"
          maxlength="4"
          required
        />
        <button class="action-btn" type="submit">Pay</button>
      </form>
    </div>

    <script type="module" src="index.js"></script>
  </body>
</html>
